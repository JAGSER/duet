<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Duet</title>
<meta name="theme-color" content="#7b2ff7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Дуэт">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --violet:#7b2ff7; --pink:#f107a3; --orange:#ff8a00; --yellow:#ffd60a; --cyan:#00d1ff; --lime:#7cff4f;
  --ink:#1d1340; --card:#ffffff; --muted:#7a6f99; --ok:#22d36b;
  --r:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:800;color:var(--ink);
  background:linear-gradient(135deg,var(--violet),var(--pink) 55%,var(--orange));background-attachment:fixed;
  min-height:100%;overflow-x:hidden;-webkit-user-select:none;user-select:none;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(circle at 15% 10%,rgba(255,214,10,.45),transparent 35%),radial-gradient(circle at 90% 85%,rgba(0,209,255,.4),transparent 40%);}
.app{position:relative;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 20px)}
.hidden{display:none!important}
h1{margin:0;font-size:28px;font-weight:900;color:#fff;letter-spacing:.5px;text-shadow:0 3px 0 rgba(0,0,0,.15)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:8px}
.logo b{display:grid;place-items:center;width:40px;height:40px;border-radius:14px;background:var(--yellow);font-size:22px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.iconbtn{width:44px;height:44px;border:0;border-radius:14px;background:rgba(255,255,255,.22);color:#fff;font-size:22px;cursor:pointer}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 10px 30px rgba(40,0,80,.25)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:18px;padding:15px 20px;font:inherit;font-size:17px;cursor:pointer;
  color:#fff;background:linear-gradient(135deg,var(--violet),var(--pink));box-shadow:0 5px 0 #4a1396;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4a1396}
.btn.y{background:var(--yellow);color:var(--ink);box-shadow:0 5px 0 #c9a400}
.btn.c{background:var(--cyan);color:var(--ink);box-shadow:0 5px 0 #0096b8}
.btn.g{background:#efeaff;color:var(--violet);box-shadow:0 5px 0 #cfc4f5}
.btn.w{width:100%}
.btn:disabled{opacity:.45}
input.f{width:100%;padding:15px 16px;border-radius:16px;border:3px solid #ece6ff;font:inherit;font-size:18px;color:var(--ink);outline:none;background:#faf8ff}
input.f:focus{border-color:var(--violet)}
label.l{display:block;margin:14px 0 8px;color:var(--muted);font-size:14px}
.emojis{display:flex;flex-wrap:wrap;gap:8px}
.emojis button{width:48px;height:48px;border-radius:14px;border:3px solid transparent;background:#f4f0ff;font-size:26px;cursor:pointer}
.emojis button.on{border-color:var(--violet);background:#fff3c4}
.hero{text-align:center;color:#fff;margin:26px 0 20px}
.hero .big{font-size:64px;line-height:1}
.hero p{font-weight:700;opacity:.95;margin:10px 0 0;font-size:16px}
.code{font-size:30px;letter-spacing:3px;text-align:center;background:#fff7d1;border:3px dashed var(--orange);border-radius:18px;padding:14px;margin:10px 0 14px;user-select:all;-webkit-user-select:all}
.small{font-size:13px;color:var(--muted);font-weight:700;line-height:1.4}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* stage */
.status{display:flex;align-items:center;gap:12px;margin-bottom:12px;color:#fff}
.ava{width:46px;height:46px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:26px;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.ava i{position:absolute;right:-3px;bottom:-3px;width:16px;height:16px;border-radius:50%;background:#b9b3c9;border:3px solid #fff}
.on .ava i{background:var(--ok);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,211,107,.7)}100%{box-shadow:0 0 0 12px rgba(34,211,107,0)}}
.status .nm{font-size:19px}
.status .st{font-size:13px;font-weight:700;opacity:.9}
.stage{position:relative;border-radius:var(--r);overflow:hidden;background:#24124f;aspect-ratio:4/3;box-shadow:0 10px 30px rgba(40,0,80,.35);transition:aspect-ratio .3s}
.ingame .stage{aspect-ratio:16/8}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#24124f}
#localV{inset:auto;top:10px;right:10px;width:28%;height:auto;aspect-ratio:3/4;border-radius:16px;border:3px solid #fff;transform:scaleX(-1);z-index:3;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.ingame #localV{width:20%}
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;z-index:2;
  background:radial-gradient(circle at 50% 40%,#5b2bc4,#24124f 70%)}
.ph .e{font-size:74px;animation:bob 2.4s ease-in-out infinite}
.ingame .ph .e{font-size:44px}
.ph .t{font-size:16px;font-weight:700;margin-top:6px;opacity:.9;padding:0 20px}
.off .ph .e{filter:grayscale(1);opacity:.6;animation:none}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.tapsound{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:4;font-size:14px;padding:8px 14px}
.floaty{position:absolute;bottom:0;font-size:42px;z-index:5;pointer-events:none;animation:fly 2.2s ease-out forwards}
@keyframes fly{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-30px) scale(1.2)}100%{transform:translateY(-260px) scale(1);opacity:0}}
.ctrls{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.ctrl{flex:1;min-width:52px;height:52px;border:0;border-radius:16px;background:rgba(255,255,255,.95);font-size:24px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.ctrl:active{transform:translateY(2px)}
.ctrl.act{background:var(--yellow)}
.ctrl.offc{background:#ffd3e1}
.reacts{display:flex;gap:6px;justify-content:space-between;margin-top:8px}
.reacts button{flex:1;height:44px;border:0;border-radius:14px;background:rgba(255,255,255,.25);font-size:22px;cursor:pointer}
.reacts button:active{transform:scale(.9)}

/* games */
.sect{color:#fff;font-size:20px;margin:20px 4px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sect span{font-size:13px;font-weight:700;opacity:.85}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;border:0;border-radius:22px;padding:16px 14px;min-height:128px;text-align:left;color:#fff;font:inherit;cursor:pointer;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.tile:active{transform:translateY(3px)}
.tile .ic{font-size:40px;line-height:1}
.tile .tt{font-size:17px;margin-top:10px}
.tile .ds{font-size:12px;font-weight:700;opacity:.92;margin-top:3px}
.tile::after{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.18)}
.tile:disabled{filter:grayscale(.6);opacity:.7}
.panel{margin-top:12px}
.ghead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ghead h2{margin:0;font-size:21px;flex:1}
.score{display:flex;justify-content:center;gap:14px;align-items:center;font-size:18px;margin:4px 0 10px}
.score b{font-size:28px;min-width:30px;text-align:center}
.msg{text-align:center;font-size:17px;min-height:26px;margin:8px 0;color:var(--muted)}
.msg.big{font-size:24px;color:var(--ink)}
.choices{display:flex;gap:10px;justify-content:center}
.choice{flex:1;max-width:120px;aspect-ratio:1;border:0;border-radius:22px;font-size:46px;cursor:pointer;background:#f3eeff;box-shadow:0 5px 0 #d8cdf7}
.choice.sel{background:var(--yellow);box-shadow:0 5px 0 #c9a400;transform:scale(1.05)}
.choice:disabled{opacity:.5}
.reveal{display:flex;justify-content:center;align-items:center;gap:20px;font-size:64px;margin:6px 0}
.reveal div{text-align:center}
.reveal small{display:block;font-size:13px;color:var(--muted)}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.rpad{height:230px;border-radius:22px;display:grid;place-items:center;text-align:center;font-size:30px;color:#fff;cursor:pointer;transition:background .1s;touch-action:manipulation}
.rpad small{display:block;font-size:15px;font-weight:700;opacity:.9}
.rope{position:relative;height:90px;margin:14px 0;border-radius:20px;background:linear-gradient(90deg,#ffd3e1 0 50%,#d4f6ff 50% 100%)}
.rope .ln{position:absolute;left:8px;right:8px;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:repeating-linear-gradient(90deg,#b07a3a 0 10px,#8a5a26 10px 20px)}
.rope .mk{position:absolute;top:50%;left:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:var(--pink);border:4px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.25);transition:left .08s linear}
.rope .s1,.rope .s2{position:absolute;top:6px;font-size:34px}
.rope .s1{left:10px}.rope .s2{right:10px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:0 auto}
.cell{aspect-ratio:1;border:0;border-radius:18px;background:#f3eeff;font-size:52px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #d8cdf7;font-family:inherit}
.cell.x{color:var(--pink)}.cell.o{color:#00a6d6}
.cell.win{background:var(--yellow)}
.q{font-size:20px;text-align:center;margin:6px 0 12px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:0;border-radius:18px;padding:18px;font:inherit;font-size:19px;cursor:pointer;background:#f3eeff;color:var(--ink);box-shadow:0 5px 0 #d8cdf7}
.opt.sel{background:var(--yellow);box-shadow:0 5px 0 #c9a400}
.opt .who{font-size:13px;color:var(--muted);display:block;margin-top:2px}
canvas#cv{width:100%;aspect-ratio:3/4;border-radius:18px;background:#fffdf5;touch-action:none;display:block;border:3px solid #f0eafc}
.pal{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.pal button{flex:none}
.pal button{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e6e0f7;cursor:pointer}
.pal button.on{box-shadow:0 0 0 3px var(--ink)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%) translateY(-120px);z-index:50;background:#fff;color:var(--ink);padding:12px 18px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:16px;transition:transform .35s cubic-bezier(.2,1.4,.4,1);max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(20,0,50,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet .card{width:100%;max-width:560px;border-radius:28px 28px 0 0;padding-bottom:calc(env(safe-area-inset-bottom) + 20px);max-height:90vh;overflow:auto}
.net{font-size:12px;color:#fff;opacity:.85;text-align:center;margin-top:16px;font-weight:700}
.langsw{display:flex;justify-content:flex-end;gap:6px}
.langsw button{border:0;border-radius:12px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer;background:rgba(255,255,255,.25);color:#fff}
.langsw button.on{background:#fff;color:var(--violet)}
.langsw.in{justify-content:flex-start}.langsw.in button{background:#f3eeff;color:var(--violet)}.langsw.in button.on{background:var(--violet);color:#fff}
.wave{position:fixed;inset:0;display:grid;place-items:center;font-size:160px;z-index:45;pointer-events:none;animation:wave 1.4s ease-out forwards}
@keyframes wave{0%{transform:scale(.3) rotate(0);opacity:0}20%{opacity:1;transform:scale(1.1) rotate(-20deg)}40%{transform:rotate(20deg)}60%{transform:rotate(-15deg)}100%{transform:scale(1.2);opacity:0}}
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:46;pointer-events:none;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- SETUP -->
  <section id="scrSetup" class="hidden">
    <div class="langsw" data-langsw></div><div class="hero"><div class="big">🎮💞</div><h1 data-i="app"></h1><p data-i="tagline"></p></div>
    <div class="card">
      <label class="l" style="margin-top:0" data-i="yourName"></label>
      <input class="f" id="inName" maxlength="16" data-iph="namePh">
      <label class="l" data-i="yourAva"></label>
      <div class="emojis" id="emojiPick"></div>
      <div style="height:18px"></div>
      <button class="btn w" id="bCreate" data-i="createPair"></button>
      <div style="height:12px"></div>
      <button class="btn g w" id="bHaveCode" data-i="haveCode"></button>
      <div id="codeBox" class="hidden">
        <label class="l" data-i="pairCode"></label>
        <input class="f" id="inCode" placeholder="XXXX-XXXX-2" autocapitalize="characters" autocomplete="off">
        <div style="height:12px"></div>
        <button class="btn c w" id="bJoin" data-i="connect"></button>
      </div>
    </div>
  </section>

  <!-- INVITE -->
  <section id="scrInvite" class="hidden">
    <div class="hero"><div class="big">💌</div><h1 data-i="inviteTitle"></h1><p data-i="inviteSub"></p></div>
    <div class="card">
      <div class="small" data-i="codeForFriend"></div>
      <div class="code" id="inviteCode">—</div>
      <button class="btn y w" id="bShare" data-i="sendInvite"></button>
      <div style="height:12px"></div>
      <button class="btn w" id="bInviteDone" data-i="inviteDone"></button>
      <p class="small" style="margin-top:14px" data-i="inviteHelp"></p>
    </div>
  </section>

  <!-- MAIN -->
  <section id="scrMain" class="hidden">
    <div class="top">
      <div class="logo"><b>🎮</b><h1 data-i="app"></h1></div>
      <button class="iconbtn" id="bSettings" >⚙️</button>
    </div>
    <div class="status" id="status">
      <div class="ava"><span id="ptEmoji">🙂</span><i></i></div>
      <div><div class="nm" id="ptName"></div><div class="st" id="ptState"></div></div>
    </div>
    <div class="stage" id="stage">
      <video id="remoteV" playsinline autoplay></video>
      <video id="localV" class="hidden" playsinline autoplay muted></video>
      <div class="ph" id="ph"><div><div class="e" id="phE">🙂</div><div class="t" id="phT"></div></div></div>
      <button class="btn y tapsound hidden" id="bSound" data-i="enableSound"></button>
    </div>
    <div class="ctrls">
      <button class="ctrl" id="bCam">📷</button>
      <button class="ctrl" id="bMic">🎤</button>
      <button class="ctrl" id="bFlip">🔄</button>
      <button class="ctrl" id="bWave">👋</button>
    </div>
    <div class="reacts" id="reacts"></div>

    <div id="lobby">
      <div class="sect"><b data-i="pickGame"></b> <span id="lobbyHint"></span></div>
      <div class="grid" id="grid"></div>
    </div>
    <div id="panel" class="panel card hidden"></div>
    <div class="net" id="net"></div>
  </section>
</div>

<div class="sheet hidden" id="sheet">
  <div class="card">
    <div class="ghead"><h2 data-i="settings"></h2><button class="btn g" id="bCloseSheet" style="padding:10px 14px">✕</button></div>
    <label class="l" style="margin-top:0" data-i="lang"></label><div class="langsw in" data-langsw></div><label class="l" data-i="name"></label>
    <input class="f" id="setName" maxlength="16">
    <label class="l" data-i="avatar"></label>
    <div class="emojis" id="setEmoji"></div>
    <label class="l" data-i="setPtCodeL"></label>
    <div class="code" id="setPtCode" style="font-size:22px"></div>
    <button class="btn y w" id="bShare2" data-i="sendInvite"></button>
    <label class="l" data-i="setMyCodeL"></label>
    <div class="code" id="setMyCode" style="font-size:22px"></div>
    <div style="height:8px"></div>
    <button class="btn w" id="bSaveSet" data-i="save"></button>
    <div style="height:12px"></div>
    <button class="btn g w" id="bUnpair" data-i="unpair"></button>
  </div>
</div>

/* --- 3. Tug of war (player A is the referee) --- */
function Tug(root) {

  const score = scoreBar(), msg = h('div', { className: 'msg' }, T.tugHelp);

  const rope = h('div', { className: 'rope' }, h('div', { className: 'ln' }), h('span', { className: 's1' }, ptEmoji()), h('span', { className: 's2' }, S.me.emoji), mk);
  const btn = h('button', { className: 'btn y w', style: 'height:120px;font-size:30px' }, '▶ ' + T.start);
  btn.addEventListener('pointerdown', e => { e.preventDefault(); if (phase === 'play') { mine++; vibrate(8); draw(); if (isA()) a = mine; } else if (phase === 'idle' || (phase === 'end' && Date.now() - endT > 1500)) { if (isA()) begin(); else gsend({ k: 'req' }); } });
  root.append(score, msg, rope, btn);

  function clear() { timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; }
  function begin() { if (phase === 'cd' || phase === 'play') return; gsend({ k: 'cd' }); countdown(); }
  function countdown() {
    clear(); phase = 'cd'; mine = theirs = a = b = 0; lastSent = -1; draw(); msg.className = 'msg big';
    [3, 2, 1].forEach((n, i) => timers.push(setTimeout(() => { msg.textContent = n + '…'; btn.textContent = n; beep(500); }, i * 800)));
    timers.push(setTimeout(() => { phase = 'play'; msg.textContent = T.pull; btn.textContent = T.tapTap; beep(1000, .2); endAt = Date.now() + DUR; loop(); }, 2400));
  }
  function loop() {
    timers.push(setInterval(() => {
      if (phase !== 'play') return;

        a = mine; theirs = b; draw();
        const d = a - b, over = Date.now() > endAt;
        if (Math.abs(d) >= GOAL || over) { const w = d > 0 ? 'a' : d < 0 ? 'b' : 'd'; gsend({ k: 'end', w, a, b }); finish(w, a, b); }
        else gsend({ k: 'p', a, b });

  }

    const meW = w === 'd' ? 0 : (w === 'a') === isA() ? 1 : -1;
    if (meW > 0) sc[0]++; if (meW < 0) sc[1]++; score.set(sc[0], sc[1]);
    mine = isA() ? ca : cb; theirs = isA() ? cb : ca; draw();
    msg.textContent = meW > 0 ? T.tugWin : meW < 0 ? T.tugLose(ptName()) : T.draw;
    btn.textContent = T.again; win(meW > 0);
  }
  return { onMsg(m) {
    if (m.k === 'req' && isA()) begin();
    if (m.k === 'cd') countdown();
    if (m.k === 'c' && isA()) b = Math.max(b, +m.n || 0);
    if (m.k === 'p' && !isA()) { theirs = +m.a || 0; draw(); }
    if (m.k === 'end') finish(m.w, +m.a, +m.b);
  }, destroy: clear };
}

  cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); last = pos(e); const s = { p: [...last, last[0] + .0001, last[1]], c: color, w: size }; strokes.push(s); seg(s); gsend({ k: 's', s }); });
  cv.addEventListener('pointermove', e => { if (!last) return; const p = pos(e); const s = { p: [last[0], last[1], p[0], p[1]].map(v => Math.round(v * 1e4) / 1e4), c: color, w: size }; last = p; strokes.push(s); seg(s); gsend({ k: 's', s }); });
  const up = () => last = null; cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  const ro = new ResizeObserver(fit); ro.observe(cv);
  return { onMsg(m) { if (m.k === 's' && m.s && Array.isArray(m.s.p)) { const s = { p: m.s.p.slice(0, 4).map(Number), c: String(m.s.c).slice(0, 9), w: Math.min(30, +m.s.w || 6) }; strokes.push(s); seg(s); } if (m.k === 'clr') { strokes = []; redraw(); } }, destroy() { ro.disconnect(); } };
}
