<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duet</title>
<meta name="robots" content="noindex">
<script>
// invite links /play/<game> and /igra/<game>: open the app even if the invite page itself is missing
(function () {
  var m = location.pathname.match(/^\/(play|igra)\/([a-z0-9-]+)/);
  if (!m) return;
  var q = location.search.replace(/^\?/, '').split('&').filter(function (x) { return x && x.indexOf('g=') !== 0; });
  q.push('g=' + m[2]);
  location.replace('/?' + q.join('&'));
})();
</script>
